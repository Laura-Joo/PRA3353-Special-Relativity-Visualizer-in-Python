<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light-cone Coordinates — Minkowski Diagram</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.10.2/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.10.2/core.js"></script>
  <py-config>
    packages = ["numpy"]
  </py-config>
</head>
<body>

  <h1>Light-cone coordinates — Minkowski diagram</h1>
  <p>Click anywhere on the diagram to place Frame A, then Frame B. Drag either endpoint to move it. Use the slider to boost between frames.</p>

  <p>
    <button id="btn-frame-a">Rest frame A</button>
    <button id="btn-frame-b">Rest frame B</button>
    <button id="btn-lab">Lab frame</button>
    <button id="btn-sweep">Sweep &#946; &#8596;</button>
    <button id="btn-clear">Clear</button>
  </p>

  <p>
    <label for="beta-slider">&#946; (v/c):</label>
    <input type="range" id="beta-slider" min="-0.95" max="0.95" step="0.01" value="0">
    <span id="beta-display">+0.00</span> c
    &nbsp;&nbsp; k = <span id="k-display">1.000</span>
    &nbsp;&nbsp; &#947; = <span id="gamma-display">1.000</span>
  </p>

  <!-- SVG viewport:
       world coords  u in [0, U_MAX], v in [0, V_MAX]
       origin at screen (PAD, H-PAD), u→right, v→up  -->
  <svg id="diagram" width="560" height="560"
       style="border:1px solid #999; background:#fafafa; display:block; cursor:crosshair;">

    <!-- grid lines (equal-ct and equal-x) redrawn by Python -->
    <g id="g-grid-ct"></g>
    <g id="g-grid-x"></g>

    <!-- rest-observer axis u=v -->
    <line id="rest-axis" x1="0" y1="0" x2="0" y2="0"
          stroke="#0F6E56" stroke-width="1.3" opacity="0.8"/>

    <!-- worldlines -->
    <line id="line-a" x1="0" y1="0" x2="0" y2="0"
          stroke="#378ADD" stroke-width="2.8" display="none"/>
    <line id="line-b" x1="0" y1="0" x2="0" y2="0"
          stroke="#D4537E" stroke-width="2.8" display="none"/>

    <!-- endpoint dots (draggable) -->
    <circle id="dot-a" cx="0" cy="0" r="8"
            fill="#378ADD" stroke="white" stroke-width="2"
            display="none" style="cursor:grab;"/>
    <circle id="dot-b" cx="0" cy="0" r="8"
            fill="#D4537E" stroke="white" stroke-width="2"
            display="none" style="cursor:grab;"/>

    <!-- axis labels -->
    <text id="label-u" x="0" y="0" font-family="serif" font-size="14" fill="#333">u</text>
    <text id="label-v" x="0" y="0" font-family="serif" font-size="14" fill="#333">v</text>
    <text id="label-a" x="0" y="0" font-family="serif" font-size="13"
          font-weight="bold" fill="#378ADD" display="none">A</text>
    <text id="label-b" x="0" y="0" font-family="serif" font-size="13"
          font-weight="bold" fill="#D4537E" display="none">B</text>

    <!-- axes drawn last so they're on top -->
    <line id="axis-u" x1="0" y1="0" x2="0" y2="0" stroke="#333" stroke-width="1.5"/>
    <line id="axis-v" x1="0" y1="0" x2="0" y2="0" stroke="#333" stroke-width="1.5"/>

  </svg>

  <pre id="info" style="font-size:13px; background:#f0f0f0; padding:10px; max-width:560px;">
Click the diagram to place worldline A, then B.</pre>

  <script type="py">
import numpy as np
from pyscript import document
from pyscript.ffi import create_proxy
import js

# ---------------------------------------------------------------------------
# viewport constants
# ---------------------------------------------------------------------------
U_MAX, V_MAX = 10.0, 10.0
W, H   = 560, 560
PAD    = 40          # pixels of padding on each side
PX     = (W - 2*PAD) / U_MAX   # pixels per world unit in u
PY     = (H - 2*PAD) / V_MAX   # pixels per world unit in v
SVG_NS = "http://www.w3.org/2000/svg"

def u2px(u):  return PAD + u * PX
def v2py(v):  return H - PAD - v * PY   # flip: v=0 at bottom
def px2u(px): return (px - PAD) / PX
def py2v(py): return (H - PAD - py) / PY

def uv2screen(u, v): return u2px(u), v2py(v)

# ---------------------------------------------------------------------------
# pure math — copied verbatim from the original script
# ---------------------------------------------------------------------------
def k_factor(beta):
    return float(np.sqrt((1.0 - beta) / (1.0 + beta)))

def xct_to_uv(x, ct):
    return ct + x, ct - x

def uv_to_xct(u, v):
    return (u - v) / 2.0, (u + v) / 2.0

def boost_uv(u, v, beta):
    k = k_factor(beta)
    return k * u, v / k

def velocity_of_lab(x, ct):
    if abs(ct) < 1e-9:
        return float("inf")
    return x / ct

def clip_uv(p0, p1):
    """Cohen–Sutherland clip to [0,U_MAX] x [0,V_MAX]. Returns (qa, qb) or None."""
    tmin, tmax = 0.0, 1.0
    for axis, lo, hi in ((0, 0.0, U_MAX), (1, 0.0, V_MAX)):
        a, b = float(p0[axis]), float(p1[axis])
        d = b - a
        if abs(d) < 1e-12:
            if a < lo - 1e-9 or a > hi + 1e-9:
                return None
            continue
        t1, t2 = (lo - a) / d, (hi - a) / d
        tmin = max(tmin, min(t1, t2))
        tmax = min(tmax, max(t1, t2))
        if tmin > tmax:
            return None
    p0a = np.array(p0, dtype=float)
    p1a = np.array(p1, dtype=float)
    return p0a + tmin * (p1a - p0a), p0a + tmax * (p1a - p0a)

# ---------------------------------------------------------------------------
# state
# ---------------------------------------------------------------------------
state = {
    "beta":    0.0,
    # lab-frame (x, ct) for each endpoint; None = not placed yet
    "A": None,   # np.array([x, ct])
    "B": None,
    "drag": None,          # "A" or "B" or None
    "sweep": {"on": False, "t": 0.0, "raf": None},
}

# ---------------------------------------------------------------------------
# DOM refs
# ---------------------------------------------------------------------------
svg        = document.getElementById("diagram")
beta_slider = document.getElementById("beta-slider")
beta_disp  = document.getElementById("beta-display")
k_disp     = document.getElementById("k-display")
g_disp     = document.getElementById("gamma-display")
info_pre   = document.getElementById("info")

def el(id_): return document.getElementById(id_)

# position axis labels once (they don't move)
el("label-u").setAttribute("x", str(u2px(U_MAX) - 6))
el("label-u").setAttribute("y", str(v2py(0) + 18))
el("label-v").setAttribute("x", str(u2px(0) - 18))
el("label-v").setAttribute("y", str(v2py(V_MAX) + 4))
# draw static axes
el("axis-u").setAttribute("x1", str(u2px(0)));  el("axis-u").setAttribute("y1", str(v2py(0)))
el("axis-u").setAttribute("x2", str(u2px(U_MAX))); el("axis-u").setAttribute("y2", str(v2py(0)))
el("axis-v").setAttribute("x1", str(u2px(0)));  el("axis-v").setAttribute("y1", str(v2py(0)))
el("axis-v").setAttribute("x2", str(u2px(0)));  el("axis-v").setAttribute("y2", str(v2py(V_MAX)))

# ---------------------------------------------------------------------------
# SVG helpers
# ---------------------------------------------------------------------------
def set_line_uv(elem_id, u0, v0, u1, v1):
    seg = clip_uv(np.array([u0, v0]), np.array([u1, v1]))
    e = el(elem_id)
    if seg is None:
        e.setAttribute("display", "none"); return
    (ua, va), (ub, vb) = seg
    e.setAttribute("display", "")
    e.setAttribute("x1", f"{u2px(ua):.2f}"); e.setAttribute("y1", f"{v2py(va):.2f}")
    e.setAttribute("x2", f"{u2px(ub):.2f}"); e.setAttribute("y2", f"{v2py(vb):.2f}")

def make_line(parent_id, color, width, dash="", opacity="1"):
    g = el(parent_id)
    ln = document.createElementNS(SVG_NS, "line")
    ln.setAttribute("stroke", color)
    ln.setAttribute("stroke-width", str(width))
    if dash: ln.setAttribute("stroke-dasharray", dash)
    ln.setAttribute("opacity", opacity)
    g.appendChild(ln)
    return ln

def set_svg_line(ln, u0, v0, u1, v1):
    seg = clip_uv(np.array([u0, v0]), np.array([u1, v1]))
    if seg is None:
        ln.setAttribute("display", "none"); return
    (ua, va), (ub, vb) = seg
    ln.setAttribute("display", "")
    ln.setAttribute("x1", f"{u2px(ua):.2f}"); ln.setAttribute("y1", f"{v2py(va):.2f}")
    ln.setAttribute("x2", f"{u2px(ub):.2f}"); ln.setAttribute("y2", f"{v2py(vb):.2f}")

# pre-create grid line elements
N_LINES = int(max(U_MAX, V_MAX)) + 2
ct_lines = [make_line("g-grid-ct", "#BD7A17", 0.9, dash="4,3", opacity="0.5")
            for _ in range(N_LINES)]
x_lines  = [make_line("g-grid-x",  "#0F6E56", 0.9, dash="2,3", opacity="0.45")
            for _ in range(N_LINES)]

# ---------------------------------------------------------------------------
# describe — mirrors the original describe() function
# ---------------------------------------------------------------------------
def describe(name, uv, beta):
    u, v = float(uv[0]), float(uv[1])
    x, ct = uv_to_xct(u, v)
    vel = x / ct if abs(ct) > 1e-9 else float("inf")
    timelike = u > 0 and v > 0
    if not np.isfinite(vel):
        v_str = "— (instant)"
    elif abs(vel) >= 1.0:
        v_str = f"{vel:+.3f} c  (spacelike!)"
    else:
        v_str = f"{vel:+.3f} c"
    tau = float(np.sqrt(u * v)) if timelike else 0.0
    tau_str = f"{tau:.3f}" if timelike else "—"
    return (f"  {name}: v = {v_str:<22s}  Δτ = √(u·v) = {tau_str}\n"
            f"     (x,ct)=({x:+.2f},{ct:+.2f})   (u,v)=({u:+.2f},{v:+.2f})")

# ---------------------------------------------------------------------------
# redraw — mirrors original redraw()
# ---------------------------------------------------------------------------
def redraw():
    beta = state["beta"]
    k    = k_factor(beta)
    g    = float(1.0 / np.sqrt(1.0 - beta * beta))

    beta_disp.textContent = f"{beta:+.2f}"
    k_disp.textContent    = f"{k:.3f}"
    g_disp.textContent    = f"{g:.3f}"

    # boosted endpoints in (u,v) frame
    boosted = {}
    for name in ("A", "B"):
        lab = state[name]
        if lab is None: continue
        x, ct = float(lab[0]), float(lab[1])
        u0, v0 = xct_to_uv(x, ct)
        ub, vb = boost_uv(u0, v0, beta)
        boosted[name] = np.array([ub, vb])

    # worldlines from origin
    origin = np.array([0.0, 0.0])
    for name, color, line_id, dot_id, lbl_id in (
        ("A", "#378ADD", "line-a", "dot-a", "label-a"),
        ("B", "#D4537E", "line-b", "dot-b", "label-b"),
    ):
        if name not in boosted:
            el(line_id).setAttribute("display", "none")
            el(dot_id ).setAttribute("display", "none")
            el(lbl_id ).setAttribute("display", "none")
            continue

        uv = boosted[name]
        set_line_uv(line_id, 0, 0, float(uv[0]), float(uv[1]))

        # clamp dot to viewport
        cu = max(0.0, min(U_MAX, float(uv[0])))
        cv = max(0.0, min(V_MAX, float(uv[1])))
        px, py = uv2screen(cu, cv)
        dot = el(dot_id)
        dot.setAttribute("cx", f"{px:.2f}"); dot.setAttribute("cy", f"{py:.2f}")
        dot.setAttribute("display", "")

        lbl = el(lbl_id)
        lbl.setAttribute("x", f"{px+10:.1f}"); lbl.setAttribute("y", f"{py-8:.1f}")
        lbl.setAttribute("display", "")

    # rest-observer axis (u = v diagonal)
    d = min(U_MAX, V_MAX)
    set_line_uv("rest-axis", 0, 0, d, d)

    # equal-ct' lines:  u + v = 2n  →  v = 2n - u
    for n, ln in enumerate(ct_lines, start=1):
        two_t = float(2 * n)
        set_svg_line(ln, 0.0, two_t, two_t, 0.0)

    # equal-x' lines:  u - v = 2n  →  u = v + 2n
    for n, ln in enumerate(x_lines, start=1):
        two_x = float(2 * n)
        v_lo  = 0.0
        v_hi  = V_MAX
        set_svg_line(ln, v_lo + two_x, v_lo, v_hi + two_x, v_hi)

    # info text
    lines = [f"frame β = {beta:+.2f} c    k = {k:.3f}    γ = {g:.3f}"]
    for name in ("A", "B"):
        if name in boosted:
            lines.append(describe(name, boosted[name], beta))
        else:
            lines.append(f"  {name}: not placed yet")
    info_pre.textContent = "\n".join(lines)

# ---------------------------------------------------------------------------
# mouse interaction
# ---------------------------------------------------------------------------
def svg_uv(ev):
    """Return (u, v) world coords from a mouse event, clamped to viewport."""
    rect = svg.getBoundingClientRect()
    px = ev.clientX - rect.left
    py = ev.clientY - rect.top
    u = max(0.05, min(U_MAX, px2u(px)))
    v = max(0.05, min(V_MAX, py2v(py)))
    return u, v

PICK_R2 = (0.6 ** 2)   # pick radius in world units squared

def on_mousedown(ev):
    u, v = svg_uv(ev)

    # check if clicking near an existing boosted endpoint → start drag
    beta = state["beta"]
    for name in ("A", "B"):
        lab = state[name]
        if lab is None: continue
        x, ct = float(lab[0]), float(lab[1])
        u0, v0 = xct_to_uv(x, ct)
        ub, vb = boost_uv(u0, v0, beta)
        if (ub - u)**2 + (vb - v)**2 < PICK_R2:
            state["drag"] = name
            return

    # otherwise place next unset endpoint
    # convert clicked (u,v) back to lab (x,ct)
    beta = state["beta"]
    k = k_factor(beta)
    # inverse boost: lab_u = u/k, lab_v = v*k
    lab_u = u / k
    lab_v = v * k
    x, ct = uv_to_xct(lab_u, lab_v)
    pt = np.array([x, ct])

    if state["A"] is None:
        state["A"] = pt
    elif state["B"] is None:
        state["B"] = pt
    # both placed: do nothing (use drag or clear)

    redraw()

def on_mousemove(ev):
    if state["drag"] is None: return
    u, v = svg_uv(ev)
    beta = state["beta"]
    k = k_factor(beta)
    lab_u = u / k
    lab_v = v * k
    x, ct = uv_to_xct(lab_u, lab_v)
    state[state["drag"]] = np.array([x, ct])
    redraw()

def on_mouseup(ev):
    state["drag"] = None

svg.addEventListener("mousedown", create_proxy(on_mousedown))
svg.addEventListener("mousemove", create_proxy(on_mousemove))
svg.addEventListener("mouseup",   create_proxy(on_mouseup))

# ---------------------------------------------------------------------------
# button handlers
# ---------------------------------------------------------------------------
def on_beta_slider(ev):
    state["beta"] = float(beta_slider.value)
    redraw()

def on_frame_a(ev):
    lab = state["A"]
    if lab is None: return
    x, ct = float(lab[0]), float(lab[1])
    v = velocity_of_lab(x, ct)
    if np.isfinite(v) and abs(v) < 0.95:
        b = round(float(v), 2)
        state["beta"] = b
        beta_slider.value = str(b)
        redraw()

def on_frame_b(ev):
    lab = state["B"]
    if lab is None: return
    x, ct = float(lab[0]), float(lab[1])
    v = velocity_of_lab(x, ct)
    if np.isfinite(v) and abs(v) < 0.95:
        b = round(float(v), 2)
        state["beta"] = b
        beta_slider.value = str(b)
        redraw()

def on_lab(ev):
    state["beta"] = 0.0
    beta_slider.value = "0"
    redraw()

def on_clear(ev):
    state["A"] = None
    state["B"] = None
    state["beta"] = 0.0
    beta_slider.value = "0"
    state["sweep"]["on"] = False
    info_pre.textContent = "Click the diagram to place worldline A, then B."
    redraw()

def on_sweep(ev):
    sw = state["sweep"]
    if sw["on"]:
        sw["on"] = False
        return
    sw["on"] = True
    sw["t"]  = 0.0

    def tick(_=None):
        if not state["sweep"]["on"]: return
        state["sweep"]["t"] += 0.05
        b = round(0.85 * float(np.sin(state["sweep"]["t"])), 2)
        state["beta"] = b
        beta_slider.value = str(b)
        redraw()
        js.requestAnimationFrame(create_proxy(tick))

    js.requestAnimationFrame(create_proxy(tick))

beta_slider.addEventListener("input",  create_proxy(on_beta_slider))
el("btn-frame-a").addEventListener("click", create_proxy(on_frame_a))
el("btn-frame-b").addEventListener("click", create_proxy(on_frame_b))
el("btn-lab").addEventListener("click",     create_proxy(on_lab))
el("btn-clear").addEventListener("click",   create_proxy(on_clear))
el("btn-sweep").addEventListener("click",   create_proxy(on_sweep))

# initial draw
redraw()
  </script>

</body>
</html>
